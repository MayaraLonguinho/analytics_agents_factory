# Domain Declarations for Central Brain

domains:
  - id: analytics
    type: domain
    name: Analytics
    description: Analytics and business intelligence projects with dashboards, reports, KPIs
    tags: [domain, analytics, business-intelligence]
    source: b_ai_engine/a_brain/c_domains/analytics/
    version: "1.0.0"
    architecture_default:
      backend: FastAPI
      frontend: React + Vite
      database: PostgreSQL
      infrastructure: Docker
      authentication: JWT
    applicable_rules:
      - dataset_validation_required
      - architecture_layering
      - type_hints_required
    applicable_patterns:
      - etl_extract_transform_load
      - rest_api_design
      - component_based_ui
      - query_optimization
    applicable_knowledge:
      - analytics_domain
      - data_pipeline_patterns
      - etl_patterns

  - id: data_engineering
    type: domain
    name: Data Engineering
    description: Data pipeline, ETL, data warehouse, data lake projects
    tags: [domain, data-engineering, data-pipeline]
    source: c_brain/
    version: "1.0.0"
    architecture_default:
      backend: FastAPI
      frontend: React + Vite
      database: PostgreSQL
      infrastructure: Docker + Kubernetes
      authentication: JWT
    applicable_rules:
      - dataset_validation_required
      - error_handling_required
      - unit_test_coverage
    applicable_patterns:
      - etl_extract_transform_load
      - etl_orchestration
      - etl_error_handling
      - migration_pattern
    applicable_knowledge:
      - etl_patterns
      - data_pipeline_patterns

skill_mappings:
  - domain_id: analytics
    skills:
      - data_profiling
      - data_visualization
      - kpi_calculation
      - report_generation

  - domain_id: data_engineering
    skills:
      - data_extraction
      - data_transformation
      - data_loading
      - pipeline_orchestration
      - quality_monitoring
