# Domain Declarations for Central Brain

domains:
  - id: analytics
    type: domain
    name: Analytics
    description: Analytics and business intelligence projects with dashboards, reports, KPIs
    tags: [domain, analytics, business-intelligence]
    source: b_ai_engine/a_brain/c_domains/analytics/
    version: "1.0.0"
    architecture_default:
      backend: FastAPI
      frontend: React + Vite
      database: PostgreSQL
      infrastructure: Docker
      authentication: JWT
    applicable_rules:
      - dataset_validation_required
      - architecture_layering
      - type_hints_required
    applicable_patterns:
      - etl_extract_transform_load
      - rest_api_design
      - component_based_ui
      - query_optimization
    applicable_knowledge:
      - analytics_domain
      - data_pipeline_patterns
      - etl_patterns

  - id: personal_finance_flow
    type: domain
    name: Personal Finance Flow
    description: Personal finance management application with transaction tracking, budgeting, analytics
    tags: [domain, finance, personal-management]
    source: b_ai_engine/a_brain/c_domains/personal_finance_flow/
    version: "1.0.0"
    architecture_default:
      backend: FastAPI
      frontend: React + Vite
      database: PostgreSQL
      infrastructure: Docker
      authentication: JWT
    applicable_rules:
      - architecture_layering
      - type_hints_required
      - authentication_required
      - encryption_at_rest
    applicable_patterns:
      - rest_api_design
      - component_based_ui
      - schema_design
      - dependency_injection
    applicable_knowledge:
      - personal_finance_domain
      - architecture_principles

  - id: crm
    type: domain
    name: CRM
    description: Customer Relationship Management system for sales and customer interactions
    tags: [domain, crm, business]
    source: b_ai_engine/a_brain/c_domains/crm/
    version: "1.0.0"
    architecture_default:
      backend: FastAPI
      frontend: React + Vite
      database: PostgreSQL
      infrastructure: Docker
      authentication: OAuth2
    applicable_rules:
      - architecture_layering
      - type_hints_required
      - authentication_required
      - input_validation_required
    applicable_patterns:
      - rest_api_design
      - component_based_ui
      - schema_design
      - repository_pattern
    applicable_knowledge:
      - crm_domain
      - architecture_principles

  - id: generic_webapp
    type: domain
    name: Generic Webapp
    description: Generic web application with REST API and frontend
    tags: [domain, webapp, general-purpose]
    source: b_ai_engine/a_brain/c_domains/generic_webapp/
    version: "1.0.0"
    architecture_default:
      backend: FastAPI
      frontend: React + Vite
      database: PostgreSQL
      infrastructure: Docker
      authentication: JWT
    applicable_rules:
      - architecture_layering
      - type_hints_required
      - docstring_required
    applicable_patterns:
      - rest_api_design
      - component_based_ui
      - dependency_injection
      - observer_pattern
    applicable_knowledge:
      - generic_webapp_domain
      - clean_architecture
      - solid_principles

  - id: data_engineering
    type: domain
    name: Data Engineering
    description: Data pipeline, ETL, data warehouse, data lake projects
    tags: [domain, data-engineering, data-pipeline]
    source: c_brain/
    version: "1.0.0"
    architecture_default:
      backend: FastAPI
      frontend: React + Vite
      database: PostgreSQL
      infrastructure: Docker + Kubernetes
      authentication: JWT
    applicable_rules:
      - dataset_validation_required
      - error_handling_required
      - unit_test_coverage
    applicable_patterns:
      - etl_extract_transform_load
      - etl_orchestration
      - etl_error_handling
      - migration_pattern
    applicable_knowledge:
      - etl_patterns
      - data_pipeline_patterns

  - id: machine_learning
    type: domain
    name: Machine Learning
    description: Machine learning model development, training, deployment
    tags: [domain, machine-learning, ai]
    source: b_ai_engine/a_brain/c_domains/
    version: "1.0.0"
    architecture_default:
      backend: FastAPI
      frontend: React + Vite
      database: PostgreSQL
      infrastructure: Docker + Kubernetes
      authentication: JWT
    applicable_rules:
      - type_hints_required
      - unit_test_coverage
      - documentation_required
    applicable_patterns:
      - rest_api_design
      - component_based_ui
      - repository_pattern
    applicable_knowledge:
      - architecture_principles

  - id: iot_platform
    type: domain
    name: IoT Platform
    description: Internet of Things platform for device management and data collection
    tags: [domain, iot, sensors]
    source: c_brain/
    version: "1.0.0"
    architecture_default:
      backend: FastAPI
      frontend: React + Vite
      database: PostgreSQL
      infrastructure: Docker + Kubernetes
      authentication: JWT
    applicable_rules:
      - error_handling_required
      - encryption_at_rest
      - monitoring_logging
    applicable_patterns:
      - etl_extract_transform_load
      - observer_pattern
      - connection_pooling
    applicable_knowledge:
      - architecture_principles

skill_mappings:
  - domain_id: analytics
    skills:
      - data_profiling
      - data_visualization
      - kpi_calculation
      - report_generation

  - domain_id: personal_finance_flow
    skills:
      - transaction_processing
      - budget_calculation
      - financial_reporting
      - data_synchronization

  - domain_id: crm
    skills:
      - contact_management
      - sales_pipeline
      - customer_tracking
      - report_generation

  - domain_id: data_engineering
    skills:
      - data_extraction
      - data_transformation
      - data_loading
      - pipeline_orchestration
      - quality_monitoring

  - domain_id: machine_learning
    skills:
      - model_training
      - feature_engineering
      - model_evaluation
      - model_deployment
