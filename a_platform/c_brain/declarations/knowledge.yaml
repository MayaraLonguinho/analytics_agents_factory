# Knowledge Declarations for Central Brain

knowledge:
  # Platform Knowledge
  - id: platform_architecture
    type: knowledge
    name: Platform Architecture
    description: Understanding of Analytics AI Factory architecture and lifecycle
    tags: [platform, architecture, core]
    source: c_brain/knowledge/platform/
    version: "1.0.0"
    relationships:
      - type: implements
        target: canonical_core
      - type: documents
        target: lifecycle_stages

  - id: lifecycle_stages
    type: knowledge
    name: Lifecycle Stages
    description: Stages of project execution (REQUESTED → DISCOVERING → DISCOVERED → PLANNING → PLANNED → GENERATING → MATERIALIZING → GENERATED → EXECUTING → VALIDATING → QUALITY_CHECK → CERTIFYING → PROJECT_READY)
    tags: [platform, lifecycle, execution]
    source: a_core/a_configuration/settings.py
    version: "1.0.0"
    relationships:
      - type: part_of
        target: platform_architecture

  - id: canonical_core
    type: knowledge
    name: Canonical Core
    description: Core platform contracts and orchestration
    tags: [platform, core, contracts]
    source: a_core/
    version: "1.0.0"
    dependencies: [lifecycle_stages]
    relationships:
      - type: defines
        target: project_request_contract
      - type: defines
        target: discovery_result_contract
      - type: defines
        target: project_plan_contract

  # Input and Discovery Knowledge
  - id: input_discovery_flow
    type: knowledge
    name: Input and Discovery Flow
    description: Natural language request parsing, dataset profiling, discovery questioning
    tags: [input, discovery, pipeline]
    source: a_input/
    version: "1.0.0"
    relationships:
      - type: uses
        target: dataset_profiling
      - type: implements
        target: discovery_session

  - id: dataset_profiling
    type: knowledge
    name: Dataset Profiling
    description: Analysis of CSV/XLSX datasets - schema, quality, distribution
    tags: [data, profiling, analysis]
    source: a_backend/b_src/b_application/analyzer.py
    version: "1.0.0"
    relationships:
      - type: uses
        target: pandas_library

  - id: discovery_session
    type: knowledge
    name: Discovery Session
    description: IDE-agent facing discovery contract with inference and approval
    tags: [discovery, agent-interaction]
    source: d_agents/a_discovery/discovery.py
    version: "1.0.0"
    relationships:
      - type: produces
        target: discovery_result_contract

  # Architecture Knowledge
  - id: architecture_principles
    type: knowledge
    name: Architecture Principles
    description: SOLID principles, Clean Architecture, layered design
    tags: [architecture, principles, design]
    source: b_ai_engine/a_brain/h_patterns/
    version: "1.0.0"

  - id: clean_architecture
    type: knowledge
    name: Clean Architecture
    description: Separation of concerns, dependency inversion, interface-based design
    tags: [architecture, design-pattern]
    source: b_ai_engine/a_brain/h_patterns/clean_architecture.md
    version: "1.0.0"
    relationships:
      - type: implements
        target: architecture_principles

  - id: solid_principles
    type: knowledge
    name: SOLID Principles
    description: Single Responsibility, Open/Closed, Liskov Substitution, Interface Segregation, Dependency Inversion
    tags: [architecture, principles]
    source: b_ai_engine/a_brain/h_patterns/solid.md
    version: "1.0.0"
    relationships:
      - type: implements
        target: architecture_principles

  # Domain Knowledge
  - id: analytics_domain
    type: knowledge
    name: Analytics Domain
    description: Analytics project patterns, dashboards, KPIs, data visualization
    tags: [domain, analytics]
    source: b_ai_engine/a_brain/c_domains/analytics/
    version: "1.0.0"

  - id: personal_finance_domain
    type: knowledge
    name: Personal Finance Domain
    description: Personal finance flow with FastAPI, React, PostgreSQL patterns
    tags: [domain, finance]
    source: b_ai_engine/a_brain/c_domains/personal_finance_flow/
    version: "1.0.0"

  - id: crm_domain
    type: knowledge
    name: CRM Domain
    description: Customer Relationship Management patterns and implementations
    tags: [domain, crm, business]
    source: b_ai_engine/a_brain/c_domains/crm/
    version: "1.0.0"

  - id: generic_webapp_domain
    type: knowledge
    name: Generic Webapp Domain
    description: Generic web application patterns with REST API and frontend
    tags: [domain, webapp]
    source: b_ai_engine/a_brain/c_domains/generic_webapp/
    version: "1.0.0"

  # Data Engineering Knowledge
  - id: etl_patterns
    type: knowledge
    name: ETL Patterns
    description: Extract, Transform, Load patterns and implementations
    tags: [data-engineering, etl, pipeline]
    source: b_ai_engine/a_brain/j_registry/etl_skills_implementation.md
    version: "1.0.0"

  - id: data_pipeline_patterns
    type: knowledge
    name: Data Pipeline Patterns
    description: Data pipeline design, orchestration, error handling
    tags: [data-engineering, pipeline]
    source: b_ai_engine/a_brain/
    version: "1.0.0"

contracts:
  - id: project_request_contract
    type: contract
    name: Project Request Contract
    description: Input contract for project intent
    source: a_core/b_domain/project_request.py
    version: "1.0.0"

  - id: discovery_result_contract
    type: contract
    name: Discovery Result Contract
    description: Output contract for discovery phase
    source: a_core/b_domain/project.py
    version: "1.0.0"

  - id: project_plan_contract
    type: contract
    name: Project Plan Contract
    description: Output contract for planning phase
    source: a_core/b_domain/project_plan.py
    version: "1.0.0"
