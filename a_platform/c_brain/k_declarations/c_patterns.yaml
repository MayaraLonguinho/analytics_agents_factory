# Pattern Declarations for Central Brain

patterns:
  # ETL Patterns
  - id: etl_extract_transform_load
    type: pattern
    name: Extract-Transform-Load
    description: Three-phase data processing pattern for ingesting and processing data
    tags: [etl, data-pipeline]
    applies_to: [analytics, data-engineering]
    source: b_ai_engine/a_brain/j_registry/etl_skills_implementation.md
    version: "1.0.0"
    components:
      - Extract (read from source)
      - Transform (apply business logic)
      - Load (write to destination)

  - id: etl_orchestration
    type: pattern
    name: ETL Orchestration
    description: Orchestration pattern for coordinating multiple ETL tasks with dependencies
    tags: [etl, orchestration, pipeline]
    applies_to: [data-engineering]
    source: c_brain/patterns/etl/
    version: "1.0.0"

  - id: etl_error_handling
    type: pattern
    name: ETL Error Handling
    description: Error handling pattern for ETL pipelines with retry, deadletter, and alerting
    tags: [etl, resilience]
    applies_to: [data-engineering]
    source: c_brain/patterns/etl/
    version: "1.0.0"

  # API Patterns
  - id: rest_api_design
    type: pattern
    name: REST API Design
    description: RESTful API design following standards for resources, verbs, status codes
    tags: [api, rest, backend]
    applies_to: [backend]
    source: c_brain/patterns/api/
    version: "1.0.0"
    components:
      - "Resource-oriented URLs"
      - "HTTP verbs (GET, POST, PUT, DELETE)"
      - "Standard status codes (200, 201, 400, 404, 500)"
      - "JSON request/response bodies"

  - id: api_versioning
    type: pattern
    name: API Versioning
    description: API versioning strategy for maintaining backward compatibility
    tags: [api, versioning]
    applies_to: [backend]
    source: c_brain/patterns/api/
    version: "1.0.0"

  - id: api_documentation
    type: pattern
    name: API Documentation
    description: OpenAPI/Swagger documentation for API endpoints
    tags: [api, documentation]
    applies_to: [backend]
    source: c_brain/patterns/api/
    version: "1.0.0"

  # Frontend Patterns
  - id: component_based_ui
    type: pattern
    name: Component-Based UI
    description: Building UIs as composable, reusable components
    tags: [frontend, architecture, react]
    applies_to: [frontend]
    source: c_brain/patterns/frontend/
    version: "1.0.0"

  - id: state_management
    type: pattern
    name: State Management
    description: Centralized state management pattern for frontend applications
    tags: [frontend, state]
    applies_to: [frontend]
    source: c_brain/patterns/frontend/
    version: "1.0.0"

  - id: responsive_design
    type: pattern
    name: Responsive Design
    description: Mobile-first, responsive UI design for multiple screen sizes
    tags: [frontend, ui, design]
    applies_to: [frontend]
    source: c_brain/patterns/frontend/
    version: "1.0.0"

  # Database Patterns
  - id: schema_design
    type: pattern
    name: Schema Design
    description: Normalized database schema design following 3NF principles
    tags: [database, design]
    applies_to: [database]
    source: c_brain/patterns/database/
    version: "1.0.0"

  - id: migration_pattern
    type: pattern
    name: Database Migration
    description: Version-controlled database migrations for schema evolution
    tags: [database, migration]
    applies_to: [database]
    source: c_brain/patterns/database/
    version: "1.0.0"

  - id: connection_pooling
    type: pattern
    name: Connection Pooling
    description: Database connection pooling for efficient resource management
    tags: [database, performance]
    applies_to: [database]
    source: c_brain/patterns/database/
    version: "1.0.0"

  - id: query_optimization
    type: pattern
    name: Query Optimization
    description: Database query optimization through indexing and execution planning
    tags: [database, performance]
    applies_to: [database]
    source: c_brain/patterns/database/
    version: "1.0.0"

  # Infrastructure Patterns
  - id: docker_containerization
    type: pattern
    name: Docker Containerization
    description: Containerizing applications with Docker for consistent deployment
    tags: [infrastructure, docker, devops]
    applies_to: [infrastructure]
    source: c_brain/patterns/infrastructure/
    version: "1.0.0"

  - id: docker_compose_orchestration
    type: pattern
    name: Docker Compose Orchestration
    description: Multi-container orchestration with Docker Compose
    tags: [infrastructure, docker, orchestration]
    applies_to: [infrastructure]
    source: c_brain/patterns/infrastructure/
    version: "1.0.0"

  - id: environment_configuration
    type: pattern
    name: Environment Configuration
    description: Environment-based configuration management (dev, staging, prod)
    tags: [infrastructure, configuration]
    applies_to: [infrastructure]
    source: c_brain/patterns/infrastructure/
    version: "1.0.0"

  - id: monitoring_logging
    type: pattern
    name: Monitoring and Logging
    description: Application monitoring and centralized logging for observability
    tags: [infrastructure, operations]
    applies_to: [infrastructure]
    source: c_brain/patterns/infrastructure/
    version: "1.0.0"

  # Cross-cutting Patterns
  - id: dependency_injection
    type: pattern
    name: Dependency Injection
    description: Loose coupling through dependency injection of services
    tags: [architecture, design-pattern]
    applies_to: [all]
    source: c_brain/patterns/
    version: "1.0.0"

  - id: repository_pattern
    type: pattern
    name: Repository Pattern
    description: Abstraction layer for data access to decouple business logic from persistence
    tags: [architecture, data-access]
    applies_to: [all]
    source: c_brain/patterns/
    version: "1.0.0"

  - id: observer_pattern
    type: pattern
    name: Observer Pattern
    description: Event-driven communication pattern for decoupled components
    tags: [architecture, event-driven]
    applies_to: [all]
    source: c_brain/patterns/
    version: "1.0.0"

  - id: factory_pattern
    type: pattern
    name: Factory Pattern
    description: Object creation pattern for flexible instance instantiation
    tags: [architecture, design-pattern]
    applies_to: [all]
    source: c_brain/patterns/
    version: "1.0.0"

  - id: strategy_pattern
    type: pattern
    name: Strategy Pattern
    description: Encapsulation of algorithms for runtime selection and substitution
    tags: [architecture, design-pattern]
    applies_to: [all]
    source: c_brain/patterns/
    version: "1.0.0"
