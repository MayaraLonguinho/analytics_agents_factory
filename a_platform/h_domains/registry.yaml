domains:
  analytics:
    description: "Plataforma de Analytics e ETL (Data Warehouse, ELT, Scripts Python)."
    templates: ["etl_script", "sql_models"]
    rules: ["pep8", "data_quality_checks", "sql_linting"]
    materializer: "analytics"
  data_engineering:
    description: "Pipeline de Dados pesado, ingestão, Airflow, Spark."
    templates: ["airflow_dag", "spark_job"]
    rules: ["pyspark_standards", "airflow_standards"]
    materializer: "data_engineering"
  personal_finance:
    description: "Aplicativo ou painel de finanças pessoais (Categorização, Transações)."
    templates: ["dashboard", "transaction_parser"]
    rules: ["privacy_anonymization", "currency_formatting"]
    materializer: "personal_finance"
  generic:
    description: "Projeto de software genérico."
    templates: ["default"]
    rules: ["pep8", "pytest"]
    materializer: "generic"
